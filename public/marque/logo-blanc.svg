  mot « Maisons » était un élément <text> en Poppins Light. Le site ne
  charge pas cette police, et un SVG servi comme image ne peut de toute
  façon pas en charger : le mot se serait affiché dans la police de repli
  du navigateur. Il est désormais tracé, donc identique partout, sans
  dépendance.

